name: Build & Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          py -m pip install --upgrade pip
          py -m pip install -r requirements.txt
          py -m pip install pyinstaller

      - name: Build with PyInstaller
        run: py -m PyInstaller baum_reseller.spec --noconfirm

      - name: Pre-install Playwright Chromium into dist
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path (Get-Location) "dist\BaumReseller\_internal\playwright-browsers"
          py -m playwright install chromium

      - name: Create LICENSE if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "LICENSE")) {
            "MIT License`n`nCopyright (c) 2026 Bruiserbaum" | Out-File LICENSE -Encoding utf8
          }

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss

      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          echo "VERSION=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.VERSION }}"
          $asset = "dist\BaumResellerSetup.exe"

          $null = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists, uploading asset."
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset `
              --title "Baum Reseller $tag" `
              --notes "## Baum Reseller $tag

Download BaumResellerSetup.exe below and run it. No Python required. Chromium is bundled.

See the commit history for changes in this release."
          }
